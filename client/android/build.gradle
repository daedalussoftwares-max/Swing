// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    buildToolsVersion = "36.0.0"
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "27.1.12297006"
    kotlinVersion = "2.1.20"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // Versions aligned with @react-native/gradle-plugin/gradle/libs.versions.toml
    classpath("com.android.tools.build:gradle:8.11.0")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    // Firebase (push). Only applied by app/build.gradle when google-services.json exists.
    classpath("com.google.gms:google-services:4.5.0")
  }
}

// Resolved from includeBuild in settings.gradle (not Maven).
plugins {
  id("com.facebook.react.rootproject")
}
